# 수집·자막 파이프라인 — 일 1회 KST 06:00 (사용자 결정으로 §1의 일 3회에서 하향.
# 회의는 평소 주 1회라 매일 아침 1회면 전일 방송분 자막까지 충분히 포착)
name: pipeline

on:
  schedule:
    - cron: "0 21 * * *"  # UTC 21:00 = KST 06:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.run_all

      - name: Commit data
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data pipeline/raw
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "pipeline: scheduled run $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git push
          fi
