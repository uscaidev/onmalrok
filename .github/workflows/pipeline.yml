# 수집·자막 파이프라인 — 일 3회 KST 06:00 / 12:00 / 21:00 (SPEC-PIPELINE.md §1)
name: pipeline

on:
  schedule:
    - cron: "0 21,3,12 * * *"  # UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        run: python -m pipeline.run_all

      - name: Commit data
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data pipeline/raw
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "pipeline: scheduled run $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git push
          fi
